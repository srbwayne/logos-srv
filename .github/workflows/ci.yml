name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      LOGOS_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      LOGOS_TEST_DB_USERNAME: postgres
      LOGOS_TEST_DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PostgreSQL test suite
        run: >-
          bash ./mvnw -Dmaven.resources.skip=true
          -Dapplication.security.jwt.secret-key=Y2ktbG9nb3Mtc2VjdXJlLXRlc3Qta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0xMjM0NTY3ODkw
          -Dapplication.security.jwt.expiration=86400000
          test -Ppostgres-it
